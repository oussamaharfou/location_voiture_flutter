name: Flutter DevSecOps Pipeline
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: Analyse Statique (SAST)
  static-analysis:
    name: Analyse Statique CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Accélère le prochain build

      - name: Install dependencies
        # On force la recherche du pubspec.yaml
        run: flutter pub get 

      - name: Static Analysis
        # Analyse le code pour détecter les vulnérabilités
        run: flutter analyze 

  # JOB 2: Analyse des Dépendances (SCA)
  dependency-scan:
    name: Analyse SCA (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Scan dependencies
        # Vérifie que tes packages ne sont pas piratables
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          severity: 'HIGH,CRITICAL'
