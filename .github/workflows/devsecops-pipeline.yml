name: Flutter DevSecOps Pipeline
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # JOB 1: Analyse Statique (SAST)
  static-analysis:
    name: Analyse Statique CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - name: Static Analysis
        run: flutter analyze # Détecte les erreurs de logique et vulnérabilités

  # JOB 2: Analyse des Dépendances (SCA)
  dependency-scan:
    name: Analyse SCA (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan dependencies
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          severity: 'HIGH,CRITICAL' # Cherche les failles graves dans tes packages
